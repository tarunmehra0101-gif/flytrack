<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ryoko offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e5fdf8; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 320px; padding: 28px; text-align: center; }
      .mark { width: 56px; height: 56px; border-radius: 20px; display: grid; place-items: center; margin: 0 auto 18px; background: rgba(20,184,166,.16); color: #5eead4; }
      p { color: rgba(229,253,248,.72); line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">RY</div>
      <h1>Ryoko is offline</h1>
      <p>Your saved ledger is available once the app shell has loaded on this device. Reconnect and refresh if this is your first visit.</p>
    </main>
  </body>
</html>
